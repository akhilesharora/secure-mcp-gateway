name: CI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-smcp:
    name: Publish smcp to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          node <<'EOF'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("packages/smcp/package.json", "utf8"));
          const releaseTag = process.env.RELEASE_TAG;
          const validTags = [pkg.version, `v${pkg.version}`];

          if (!validTags.includes(releaseTag)) {
            console.error(
              `Release tag "${releaseTag}" does not match packages/smcp/package.json version "${pkg.version}".`
            );
            process.exit(1);
          }

          console.log(`Release tag ${releaseTag} matches smcp version ${pkg.version}.`);
          EOF
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Preview npm package contents
        run: npm pack --dry-run --workspace @datacline/smcp

      - name: Publish npm package
        run: npm publish --workspace @datacline/smcp --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
